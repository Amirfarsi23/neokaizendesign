<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="canonical" href="{{ site.url }}">
<meta name="theme-color" content="#05060a">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.company }}">
<meta property="og:url" content="{{ site.url }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="{{ site.url }}assets/img/brand/og-image.jpg">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">
<meta name="twitter:image" content="{{ site.url }}assets/img/brand/og-image.jpg">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": {{ site.company|tojson }},
  "url": {{ site.url|tojson }},
  "email": {{ site.contact.email|tojson }},
  "image": {{ (site.url ~ "assets/img/brand/og-image.jpg")|tojson }},
  "description": {{ site.description|tojson }},
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Eggenfelden",
    "addressRegion": "Bayern",
    "addressCountry": "DE"
  },
  "sameAs": [{{ site.contact.instagram|tojson }}, {{ site.contact.github|tojson }}]
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/scroll.css">
<link rel="stylesheet" href="assets/css/pieces.css">
<link rel="icon" type="image/png" href="assets/img/brand/favicon.png">
</head>
<body>

<a href="#page" class="skip-link">Zum Inhalt springen</a>
<h1 class="visually-hidden">{{ site.title }}</h1>
<div id="cursor-glow"></div>
<div id="topbar-bg"></div>
<nav id="site-nav" aria-label="Hauptnavigation">
  <a href="#top" id="brand">
    <img src="assets/img/brand/logo-64.png" alt="" class="brand-mark">
    <span class="wordmark"><span class="wm-light">NEO</span><span class="wm-structure">KAIZEN</span> <span class="wm-light">DESIGN</span></span>
  </a>
  <ul id="navmenu">
    {%- for item in site.nav %}
    {%- if item.href != '#videos' or videos %}
    <li><a href="{{ item.href }}"{% if item.tool %} class="is-tool"{% endif %}>{{ item.label }}</a></li>
    {%- endif %}
    {%- endfor %}
  </ul>
</nav>

{% block content %}{% endblock %}

<script>
window.NKD_FRAMES   = {{ scroll.frames|tojson }};
window.NKD_CAPTIONS = {{ scroll.captions|tojson }};
</script>
<button id="to-top" aria-label="Nach oben">
  <svg viewBox="0 0 24 24"><polyline points="18,15 12,9 6,15"/></svg>
</button>

<script src="assets/js/scroll.js"></script>
<script src="assets/js/pieces.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
